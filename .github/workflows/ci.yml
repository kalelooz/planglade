name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Verify public and CI boundaries
        run: |
          npm run check:public
          npm run check:ci
          npm run check:docs
          npm run check:hosting
          npm run check:release
          npm run check:backend-surface --prefix backend

      - name: Generate and validate Prisma client
        env:
          DATABASE_URL: file:${{ runner.temp }}/planglade-ci.db
        run: |
          npm run db:generate --prefix backend
          npm exec --prefix backend -- prisma validate --schema backend/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare backend test database
        env:
          DATABASE_URL: file:${{ runner.temp }}/planglade-ci.db
        run: npm run db:migrate:deploy --prefix backend

      - name: Rehearse release backup and restore
        run: npm run test:release

      - name: Test
        env:
          DATABASE_URL: file:${{ runner.temp }}/planglade-ci.db
        run: npm test

      - name: Build
        env:
          DATABASE_URL: file:${{ runner.temp }}/planglade-ci.db
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXTAUTH_SECRET: ci-only-nextauth-secret-keep-out-of-production-2026
          NEXT_PUBLIC_PLANGLADE_AUTH_MODE: nextauth
          PLANGLADE_AUTH_MODE: nextauth
          PLANGLADE_EMAIL_PROVIDER: disabled
          PLANGLADE_LOCAL_AUTH_ENABLED: "true"
          PLANGLADE_LOCAL_STORAGE_DIR: ${{ runner.temp }}/planglade-ci-attachments
          PLANGLADE_STORAGE_PROVIDER: local
          PLANGLADE_STORAGE_SIGNING_SECRET: ci-only-storage-secret-keep-out-of-production-2026
        run: npm run build

  integration:
    name: Authenticated browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Generate Prisma client
        run: npm run db:generate --prefix backend

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run authenticated integration suite
        env:
          PLANGLADE_E2E_BACKEND_DIR: ${{ github.workspace }}/backend
        run: npm run test:e2e:integration --prefix frontend

      - name: Upload integration failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-failure-${{ github.run_id }}
          path: frontend/test-results/vite-integration
          if-no-files-found: ignore
          retention-days: 7
