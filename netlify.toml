[build]
  command = "npm ci --prefix frontend && npm run check:site && npm run build:site && npm run check:site-output"
  publish = "website/dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "11.6.2"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[redirects]]
  from = "/landing"
  to = "/"
  status = 301

[[redirects]]
  from = "/demo"
  to = "/demo/"
  status = 301

[[redirects]]
  from = "/demo/*"
  to = "/demo/index.html"
  status = 200

[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/demo/*"

  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
